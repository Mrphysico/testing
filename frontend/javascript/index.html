<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Government Accident Detection & Alert System</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: "#1E3A8A",
            primaryLight: "#2563EB",
            danger: "#DC2626",
            dangerLight: "#EF4444",
            card: "#F0F4FF",
            borderBlue: "#BFDBFE",
            success: "#16A34A"
          }
        }
      }
    };
  </script>

  <!-- External Libraries -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
  <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone@7.26.9/babel.min.js"></script>

  <!-- Custom Modular Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div id="root"></div>

  <!-- Modular React Application Script -->
  <script type="text/babel" data-presets="react" src="/js/app.js"></script>
</body>
</html>
